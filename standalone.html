  <style>
:root {
  --bg: #0f1115;
  --panel: #171a21;
  --panel-2: #1e222b;
  --border: #2a2f3a;
  --text: #e7e9ee;
  --muted: #8b93a3;
  --team-a: #4da3ff;
  --team-b: #ff6b6b;
  --good: #3ddc84;
  --bad: #ff5c5c;
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
}

* { box-sizing: border-box; }

html {
  -webkit-text-size-adjust: 100%;
  background: var(--bg);
  color-scheme: dark;
}

body {
  margin: 0;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  background: var(--bg);
  color: var(--text);
  font-size: 16px;
  line-height: 1.4;
  -webkit-tap-highlight-color: transparent;
  overscroll-behavior-y: contain;
}

button, input {
  font-family: inherit;
  color: inherit;
}

/* Anything tappable gets a finger-sized target and no text selection. */
button {
  min-height: 44px;
  border: none;
  background: none;
  cursor: pointer;
  -webkit-user-select: none;
  user-select: none;
}

.app {
  max-width: 560px;
  margin: 0 auto;
  padding: calc(var(--safe-top) + 12px) 14px calc(var(--safe-bottom) + 96px);
}

/* --- header --- */

header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 16px;
}

header h1 {
  font-size: 1.15rem;
  font-weight: 700;
  margin: 0;
  letter-spacing: -0.01em;
}

.clear-btn {
  font-size: 0.85rem;
  color: var(--muted);
  padding: 8px 12px;
  border-radius: 8px;
  border: 1px solid var(--border);
  min-height: 36px;
}

.clear-btn:disabled { opacity: 0.35; }

/* --- team cards --- */

.team {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 14px;
  margin-bottom: 12px;
}

.team h2 {
  font-size: 0.8rem;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: var(--muted);
  margin: 0 0 10px;
  display: flex;
  align-items: center;
  gap: 8px;
}

.dot {
  width: 9px;
  height: 9px;
  border-radius: 50%;
  flex: none;
}

.dot-a { background: var(--team-a); }
.dot-b { background: var(--team-b); }

.slots {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
}

/* 5 slots in a 2-column grid: the last one spans the full width. */
.slots .slot:nth-child(5) { grid-column: 1 / -1; }

.slot {
  display: flex;
  align-items: center;
  gap: 6px;
  width: 100%;
  min-height: 46px;
  padding: 0 6px 0 12px;
  background: var(--panel-2);
  border: 1px solid var(--border);
  border-radius: 10px;
  font-size: 0.92rem;
  text-align: left;
  transition: border-color 0.12s, background 0.12s;
}

.slot .label {
  flex: 1;
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.slot.empty .label { color: var(--muted); }
.slot.filled { background: #232838; }
.team[data-team="a"] .slot.filled { border-color: rgba(77, 163, 255, 0.55); }
.team[data-team="b"] .slot.filled { border-color: rgba(255, 107, 107, 0.55); }
.slot:active { background: #2b3142; }

.slot .remove {
  flex: none;
  width: 30px;
  min-height: 30px;
  height: 30px;
  border-radius: 8px;
  color: var(--muted);
  font-size: 1.2rem;
  line-height: 1;
  display: flex;
  align-items: center;
  justify-content: center;
}

.slot .remove:active { background: rgba(255, 255, 255, 0.08); }

/* --- verdict --- */

.verdict {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 20px 16px;
  text-align: center;
  margin: 16px 0 12px;
}

.verdict .winner {
  font-size: 1.5rem;
  font-weight: 700;
  margin-bottom: 4px;
  letter-spacing: -0.01em;
}

.verdict .winner.team-a { color: var(--team-a); }
.verdict .winner.team-b { color: var(--team-b); }
.verdict .winner.toss-up { color: var(--muted); }

.verdict .total {
  color: var(--muted);
  font-size: 0.82rem;
  font-variant-numeric: tabular-nums;
}

.verdict .hint {
  color: var(--muted);
  font-size: 0.88rem;
}

.verdict .note {
  margin-top: 10px;
  font-size: 0.75rem;
  color: #c9a227;
}

/* Compact copy of the verdict, pinned while the real one is off-screen. */
.mini-verdict {
  position: fixed;
  left: 0;
  right: 0;
  bottom: 0;
  z-index: 40;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  padding: 12px 16px calc(var(--safe-bottom) + 12px);
  background: rgba(23, 26, 33, 0.92);
  -webkit-backdrop-filter: blur(12px);
  backdrop-filter: blur(12px);
  border-top: 1px solid var(--border);
  font-size: 0.95rem;
  font-weight: 600;
  transform: translateY(105%);
  transition: transform 0.2s ease;
}

.mini-verdict.show { transform: translateY(0); }
.mini-verdict .team-a { color: var(--team-a); }
.mini-verdict .team-b { color: var(--team-b); }
.mini-verdict .toss-up { color: var(--muted); }

.mini-verdict .num {
  color: var(--muted);
  font-weight: 500;
  font-size: 0.82rem;
  font-variant-numeric: tabular-nums;
}

/* --- per-hero bars --- */

.bars {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 14px;
  margin-bottom: 12px;
}

.hero-row {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 72px;
  align-items: center;
  gap: 10px;
  padding: 9px 0;
  border-bottom: 1px solid var(--border);
}

.hero-row:last-child { border-bottom: none; }

.hero-row .name {
  font-size: 0.88rem;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  margin-bottom: 5px;
}

/* Bars grow from a centre line: left = favourable, right = unfavourable. */
.bar-track {
  position: relative;
  height: 8px;
  background: var(--panel-2);
  border-radius: 5px;
  overflow: hidden;
}

.bar-track::after {
  content: "";
  position: absolute;
  left: 50%;
  top: 0;
  bottom: 0;
  width: 1px;
  background: var(--border);
}

.bar-fill {
  position: absolute;
  top: 0;
  bottom: 0;
  border-radius: 5px;
  transition: left 0.18s, width 0.18s;
}

.bar-fill.good { background: var(--good); }
.bar-fill.bad { background: var(--bad); }

.hero-row .value {
  text-align: right;
  font-variant-numeric: tabular-nums;
}

.hero-row .value .total {
  font-weight: 600;
  font-size: 0.92rem;
}

.hero-row .value .avg {
  font-size: 0.68rem;
  color: var(--muted);
}

.value.good .total { color: var(--good); }
.value.bad .total { color: var(--bad); }
.value.flat .total { color: var(--muted); }

/* --- breakdown tables --- */

details {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 4px 14px;
  margin-bottom: 12px;
}

summary {
  cursor: pointer;
  font-weight: 600;
  font-size: 0.85rem;
  color: var(--muted);
  padding: 12px 0;
  list-style: none;
}

summary::-webkit-details-marker { display: none; }
summary::after { content: " ›"; display: inline-block; transform: rotate(90deg); }
details[open] summary::after { transform: rotate(-90deg); }

table {
  width: 100%;
  border-collapse: collapse;
  margin-bottom: 12px;
  font-size: 0.8rem;
}

th, td {
  text-align: left;
  padding: 6px 4px;
  border-bottom: 1px solid var(--border);
}

th {
  color: var(--muted);
  font-weight: 600;
  font-size: 0.72rem;
  text-transform: uppercase;
  letter-spacing: 0.04em;
}

td:last-child, th:last-child {
  text-align: right;
  font-variant-numeric: tabular-nums;
}

td.good { color: var(--good); }
td.bad { color: var(--bad); }
td.flat { color: var(--muted); }

.footnote {
  color: var(--muted);
  font-size: 0.72rem;
  text-align: center;
  line-height: 1.5;
  margin-top: 18px;
}

/* --- hero picker sheet --- */

.sheet {
  position: fixed;
  inset: 0;
  z-index: 100;
  display: flex;
  flex-direction: column;
  background: var(--bg);
  padding-top: var(--safe-top);
}

.sheet[hidden] { display: none; }

.sheet-head {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 14px;
  border-bottom: 1px solid var(--border);
}

.sheet-head input {
  flex: 1;
  min-width: 0;
  /* 16px keeps iOS Safari from zooming the page when the field is focused. */
  font-size: 16px;
  padding: 11px 14px;
  background: var(--panel-2);
  border: 1px solid var(--border);
  border-radius: 10px;
}

.sheet-head input:focus {
  outline: none;
  border-color: var(--team-a);
}

.sheet-head button {
  flex: none;
  color: var(--team-a);
  font-size: 0.95rem;
  padding: 0 4px;
}

.sheet-title {
  padding: 10px 16px 4px;
  font-size: 0.75rem;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: var(--muted);
}

.hero-list {
  flex: 1;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  padding: 4px 8px calc(var(--safe-bottom) + 20px);
}

.hero-option {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  width: 100%;
  min-height: 48px;
  padding: 0 12px;
  border-radius: 10px;
  font-size: 0.98rem;
  text-align: left;
}

.hero-option:active { background: var(--panel-2); }
.hero-option.taken { color: var(--muted); }

.hero-option .taken-tag {
  font-size: 0.7rem;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  padding: 3px 7px;
  border-radius: 6px;
  border: 1px solid var(--border);
  flex: none;
}

.hero-option .taken-tag.a { color: var(--team-a); border-color: rgba(77, 163, 255, 0.4); }
.hero-option .taken-tag.b { color: var(--team-b); border-color: rgba(255, 107, 107, 0.4); }

.empty-msg {
  color: var(--muted);
  text-align: center;
  padding: 32px 16px;
  font-size: 0.9rem;
}

</style>
</head>
<body>
  <div class="app">
    <header>
      <h1>Draft Predictor</h1>
      <button type="button" class="clear-btn" id="clear" disabled>Clear</button>
    </header>

    <section class="team" data-team="a">
      <h2><span class="dot dot-a"></span>Team A &middot; Radiant</h2>
      <div class="slots" id="slots-a"></div>
    </section>

    <section class="team" data-team="b">
      <h2><span class="dot dot-b"></span>Team B &middot; Dire</h2>
      <div class="slots" id="slots-b"></div>
    </section>

    <div id="output"></div>
  </div>

  <div class="mini-verdict" id="mini-verdict" aria-hidden="true"></div>

  <div class="sheet" id="sheet" hidden>
    <div class="sheet-head">
      <input type="search" id="search" placeholder="Search heroes" autocomplete="off"
             autocorrect="off" autocapitalize="off" spellcheck="false">
      <button type="button" id="sheet-cancel">Cancel</button>
    </div>
    <div class="sheet-title" id="sheet-title">Pick a hero</div>
    <div class="hero-list" id="hero-list"></div>

  <script>
/*
 * Dota 2 draft predictor -- on-device port of predictor.py.
 *
 * The maths is deliberately identical to MatchupModel.predict(): Dotabuff's
 * "Disadvantage" is one-sided, so a hero's own page and its opponent's page
 * disagree about the same matchup. We total each direction separately and
 * blend them, exactly as the Python version does.
 */

(function () {
  "use strict";

  var DATA = window.DOTA_DATA;
  var NAMES = DATA.heroes;
  var DIS = DATA.dis;
  var TEAM_SIZE = 5;
  var STORAGE_KEY = "dota-draft-v1";

  // Matchups Dotabuff has too few games for, as a "i,j" lookup.
  var LOW = Object.create(null);
  DATA.low.forEach(function (pair) { LOW[pair[0] + "," + pair[1]] = true; });

  // Hero index per slot, or null when the slot is empty.
  var teams = {
    a: [null, null, null, null, null],
    b: [null, null, null, null, null]
  };

  // ---------------------------------------------------------------- maths

  function disadvantage(i, j) {
    var v = DIS[i][j];
    return v === null ? 0 : v;
  }

  function round(value, places) {
    var f = Math.pow(10, places);
    return Math.round(value * f) / f;
  }

  function heroSummary(hero, opponents) {
    var vs = opponents.map(function (opp) {
      return {
        opponent: opp,
        disadvantage: round(disadvantage(hero, opp), 4),
        lowConfidence: LOW[hero + "," + opp] === true
      };
    });
    var total = vs.reduce(function (sum, v) { return sum + v.disadvantage; }, 0);
    return {
      hero: hero,
      vs: vs,
      total: round(total, 4),
      avg: vs.length ? round(total / vs.length, 4) : 0
    };
  }

  function predict(teamA, teamB) {
    var totalFromA = 0;
    var totalFromB = 0;
    var i, j;

    for (i = 0; i < teamA.length; i++) {
      for (j = 0; j < teamB.length; j++) totalFromA += disadvantage(teamA[i], teamB[j]);
    }
    for (i = 0; i < teamB.length; i++) {
      for (j = 0; j < teamA.length; j++) totalFromB += disadvantage(teamB[i], teamA[j]);
    }

    var total = (totalFromA - totalFromB) / 2;
    var winner = total > 0 ? "Team B" : (total < 0 ? "Team A" : "Toss-up");

    return {
      total: round(total, 2),
      winner: winner,
      teamASummary: teamA.map(function (h) { return heroSummary(h, teamB); }),
      teamBSummary: teamB.map(function (h) { return heroSummary(h, teamA); })
    };
  }

  // ------------------------------------------------------------- elements

  var slotContainers = { a: document.getElementById("slots-a"), b: document.getElementById("slots-b") };
  var output = document.getElementById("output");
  var miniVerdict = document.getElementById("mini-verdict");
  var clearBtn = document.getElementById("clear");
  var sheet = document.getElementById("sheet");
  var sheetTitle = document.getElementById("sheet-title");
  var search = document.getElementById("search");
  var heroList = document.getElementById("hero-list");

  function escapeHtml(text) {
    return String(text).replace(/[&<>"']/g, function (ch) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[ch];
    });
  }

  function picked(team) {
    return teams[team].filter(function (h) { return h !== null; });
  }

  function whereIs(hero) {
    if (teams.a.indexOf(hero) !== -1) return "a";
    if (teams.b.indexOf(hero) !== -1) return "b";
    return null;
  }

  // --------------------------------------------------------------- slots

  function renderSlots() {
    ["a", "b"].forEach(function (team) {
      var html = "";
      for (var i = 0; i < TEAM_SIZE; i++) {
        var hero = teams[team][i];
        if (hero === null) {
          html += '<button type="button" class="slot empty" data-team="' + team +
            '" data-slot="' + i + '"><span class="label">Add hero</span></button>';
        } else {
          html += '<button type="button" class="slot filled" data-team="' + team +
            '" data-slot="' + i + '"><span class="label">' + escapeHtml(NAMES[hero]) +
            '</span><span class="remove" data-remove="1" role="button" ' +
            'aria-label="Remove ' + escapeHtml(NAMES[hero]) + '">&times;</span></button>';
        }
      }
      slotContainers[team].innerHTML = html;
    });
    clearBtn.disabled = picked("a").length === 0 && picked("b").length === 0;
  }

  ["a", "b"].forEach(function (team) {
    slotContainers[team].addEventListener("click", function (event) {
      var slot = event.target.closest(".slot");
      if (!slot) return;
      var index = Number(slot.dataset.slot);
      if (event.target.dataset.remove) {
        teams[team][index] = null;
        update();
      } else {
        openSheet(team, index);
      }
    });
  });

  clearBtn.addEventListener("click", function () {
    teams.a = [null, null, null, null, null];
    teams.b = [null, null, null, null, null];
    update();
  });

  // --------------------------------------------------------- hero picker

  var sheetTarget = null;

  function openSheet(team, slot) {
    sheetTarget = { team: team, slot: slot };
    sheetTitle.textContent = (teams[team][slot] === null ? "Add to " : "Replace in ") +
      (team === "a" ? "Team A" : "Team B");
    search.value = "";
    renderHeroList("");
    sheet.hidden = false;
    document.body.style.overflow = "hidden";
    heroList.scrollTop = 0;
  }

  function closeSheet() {
    sheet.hidden = true;
    sheetTarget = null;
    document.body.style.overflow = "";
  }

  function renderHeroList(query) {
    var needle = query.trim().toLowerCase();
    var html = "";
    var shown = 0;

    for (var i = 0; i < NAMES.length; i++) {
      if (needle && NAMES[i].toLowerCase().indexOf(needle) === -1) continue;
      shown++;
      var on = whereIs(i);
      // A hero already on this exact slot is still selectable (no-op); one used
      // elsewhere is shown but marked, and tapping it moves it to this slot.
      var tag = on && !(sheetTarget && teams[sheetTarget.team][sheetTarget.slot] === i)
        ? '<span class="taken-tag ' + on + '">Team ' + on.toUpperCase() + "</span>"
        : "";
      html += '<button type="button" class="hero-option' + (on ? " taken" : "") +
        '" data-hero="' + i + '"><span>' + escapeHtml(NAMES[i]) + "</span>" + tag + "</button>";
    }

    heroList.innerHTML = shown ? html : '<div class="empty-msg">No hero matches that.</div>';
  }

  search.addEventListener("input", function () { renderHeroList(search.value); });
  document.getElementById("sheet-cancel").addEventListener("click", closeSheet);

  heroList.addEventListener("click", function (event) {
    var option = event.target.closest(".hero-option");
    if (!option || !sheetTarget) return;
    var hero = Number(option.dataset.hero);

    // A hero can only appear once in a draft, so picking one that is already
    // placed moves it here rather than duplicating it.
    ["a", "b"].forEach(function (team) {
      var at = teams[team].indexOf(hero);
      if (at !== -1) teams[team][at] = null;
    });
    teams[sheetTarget.team][sheetTarget.slot] = hero;

    closeSheet();
    update();
  });

  // --------------------------------------------------------------- output

  function barHtml(value, maxAbs) {
    // Bars grow out from a centre line: left/green is a favourable matchup,
    // right/red an unfavourable one.
    var half = maxAbs ? (Math.abs(value) / maxAbs) * 50 : 0;
    var good = value < 0;
    var left = good ? 50 - half : 50;
    return '<div class="bar-track"><div class="bar-fill ' + (good ? "good" : "bad") +
      '" style="left:' + left + "%;width:" + half + '%"></div></div>';
  }

  function summaryHtml(title, dotClass, summaries, maxAbs) {
    var rows = summaries.map(function (h) {
      var cls = h.total > 0 ? "bad" : (h.total < 0 ? "good" : "flat");
      return '<div class="hero-row"><div><div class="name">' + escapeHtml(NAMES[h.hero]) +
        "</div>" + barHtml(h.total, maxAbs) + '</div><div class="value ' + cls +
        '"><div class="total">' + h.total.toFixed(2) + '</div><div class="avg">avg ' +
        h.avg.toFixed(2) + "</div></div></div>";
    }).join("");

    return '<div class="bars"><h2 style="font-size:.8rem;text-transform:uppercase;' +
      'letter-spacing:.06em;color:var(--muted);margin:0 0 6px;display:flex;' +
      'align-items:center;gap:8px"><span class="dot ' + dotClass + '"></span>' +
      title + "</h2>" + rows + "</div>";
  }

  function tableHtml(label, otherLabel, summaries) {
    var rows = summaries.map(function (h) {
      return h.vs.map(function (v) {
        var cls = v.disadvantage > 0 ? "bad" : (v.disadvantage < 0 ? "good" : "flat");
        return "<tr><td>" + escapeHtml(NAMES[h.hero]) + "</td><td>" +
          escapeHtml(NAMES[v.opponent]) + (v.lowConfidence ? " *" : "") +
          '</td><td class="' + cls + '">' + v.disadvantage.toFixed(2) + "</td></tr>";
      }).join("");
    }).join("");

    return "<details><summary>" + label + " breakdown</summary><table><thead><tr><th>" +
      label + "</th><th>vs " + otherLabel + "</th><th>Disadv.</th></tr></thead><tbody>" +
      rows + "</tbody></table></details>";
  }

  function render(result) {
    var totals = result.teamASummary.concat(result.teamBSummary).map(function (h) {
      return Math.abs(h.total);
    });
    var maxAbs = Math.max.apply(null, totals.concat([0])) || 1;

    var winnerClass = { "Team A": "team-a", "Team B": "team-b", "Toss-up": "toss-up" }[result.winner];
    var headline = result.winner === "Toss-up" ? "Too close to call" : result.winner + " favored";

    var anyLow = result.teamASummary.concat(result.teamBSummary).some(function (h) {
      return h.vs.some(function (v) { return v.lowConfidence; });
    });

    output.innerHTML =
      '<div class="verdict" id="verdict"><div class="winner ' + winnerClass + '">' +
      headline + '</div><div class="total">Team A net disadvantage ' +
      result.total.toFixed(2) + "</div>" +
      (anyLow ? '<div class="note">* some matchups have very few recorded games</div>' : "") +
      "</div>" +
      summaryHtml("Team A", "dot-a", result.teamASummary, maxAbs) +
      summaryHtml("Team B", "dot-b", result.teamBSummary, maxAbs) +
      tableHtml("Team A", "Team B", result.teamASummary) +
      tableHtml("Team B", "Team A", result.teamBSummary);

    miniVerdict.innerHTML = '<span class="' + winnerClass + '">' + headline +
      '</span><span class="num">' + result.total.toFixed(2) + "</span>";
    verdictNode = document.getElementById("verdict");
    updateMiniVerdict();
  }

  function renderPrompt() {
    var a = picked("a").length;
    var b = picked("b").length;
    var message = !a && !b
      ? "Pick at least one hero for each team."
      : "Add a hero to Team " + (a ? "B" : "A") + " to see a prediction.";
    output.innerHTML = '<div class="verdict"><div class="hint">' + message + "</div></div>";
    verdictNode = null;
    updateMiniVerdict();
  }

  // The pinned summary bar only earns its space once the real verdict has
  // scrolled up out of view.
  var verdictNode = null;

  function updateMiniVerdict() {
    var show = verdictNode !== null && verdictNode.getBoundingClientRect().bottom < 48;
    miniVerdict.classList.toggle("show", show);
  }

  window.addEventListener("scroll", updateMiniVerdict, { passive: true });

  // --------------------------------------------------------------- state

  function save() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(teams));
    } catch (err) {
      /* Private mode or blocked storage -- the draft just won't persist. */
    }
  }

  function restore() {
    var raw;
    try {
      raw = localStorage.getItem(STORAGE_KEY);
    } catch (err) {
      return;
    }
    if (!raw) {
      // Very first open: show a worked example rather than ten empty slots.
      // Clear wipes it and the empty draft is what gets saved from then on.
      seedExample();
      return;
    }

    try {
      var saved = JSON.parse(raw);
      ["a", "b"].forEach(function (team) {
        var list = saved && saved[team];
        if (!Array.isArray(list)) return;
        for (var i = 0; i < TEAM_SIZE; i++) {
          var hero = list[i];
          // Guard against a stale draft saved before the hero list changed.
          teams[team][i] = (typeof hero === "number" && hero >= 0 && hero < NAMES.length)
            ? hero
            : null;
        }
      });
    } catch (err) {
      /* Unreadable saved draft -- start empty. */
    }
  }

  function seedExample() {
    var sample = {
      a: ["Pudge", "Juggernaut", "Crystal Maiden", "Anti-Mage", "Rubick"],
      b: ["Invoker", "Faceless Void", "Lion", "Terrorblade", "Tidehunter"]
    };
    ["a", "b"].forEach(function (team) {
      sample[team].forEach(function (name, i) {
        var index = NAMES.indexOf(name);
        teams[team][i] = index === -1 ? null : index;
      });
    });
  }

  function update() {
    renderSlots();
    var a = picked("a");
    var b = picked("b");
    if (a.length && b.length) render(predict(a, b));
    else renderPrompt();
    save();
  }

  restore();
  update();
})();

</script>

// Service workers only run on https:// or localhost; anywhere else (file://,
// plain http) this quietly does nothing and the app still works online.
if ("serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "localhost")) {
  navigator.serviceWorker.register("sw.js").catch(function () {});
}

</script>
